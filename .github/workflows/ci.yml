# One workflow: the three test layers, then — on main only, and only when all three passed — the
# Pages deploy, shipping the very UF2 the foxlib-c job built and tested rather than a second build.
name: ci
on:
  push:
  pull_request:
  # "Run workflow" in the Actions tab. Left alone it just forces a full test run (and the Pages deploy, when
  # run from main). Tick "release" and, once the tests pass, it also tags main at the page version in
  # js/main.js and publishes the GitHub Release — the same thing pushing a vX.Y.Z tag does by hand.
  workflow_dispatch:
    inputs:
      release:
        description: 'Also publish a GitHub Release (tags main at the js/main.js VERSION)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies
        working-directory: tests
        run: npm ci
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium
      - name: Unit tests (REPL protocol, device layer, model)
        working-directory: tests
        run: npm run unit
      - name: Page smoke test (every tab × every template on the demo board; exported zips booted in the firmware simulator and, for the foxlib-c target, in the C runner's host build)
        working-directory: tests
        run: SHOTS=../_shots npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-screenshots
          path: _shots
          retention-days: 7

  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Syntax check (CircuitPython-compatible subset is not enforced here; the sim is)
        run: python3 -m py_compile firmware/foxlib/*.py firmware/templates/*/code.py
      - name: Catalog lint (descriptors, defaults through the firmware validator, index files, version bumps)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && ! echo "$BASE" | grep -q '^0*$' && git cat-file -e "$BASE" 2>/dev/null; then
            python3 tools/check_catalog.py --since "$BASE"
          else
            python3 tools/check_catalog.py
          fi
      - name: Docs name only files that exist
        run: python3 tools/check_docs.py
      - name: Simulator — every template, every scenario
        run: python3 firmware/sim/run.py
      - name: Bench script against the simulated board on a pty (tools/hw_smoke.py end to end)
        run: |
          pip install --quiet pyserial
          python3 firmware/sim/pty_board.py --quiet > /tmp/port &
          for i in $(seq 1 50); do [ -s /tmp/port ] && break; sleep 0.2; done; test -s /tmp/port
          python3 tools/hw_smoke.py --port "$(cat /tmp/port)" --call "W1ABC FOX DE W1ABC" --yes-antenna --observe 0.5 --templates morse-songs,morse-sstv,resurrection --report /tmp/hw_smoke.json
          python3 -c "import json; r=json.load(open('/tmp/hw_smoke.json')); assert all(t['ok'] and t['key']=='ok' for t in r['templates'].values()), r"
      - name: Python / JS encoder parity
        run: |
          python3 firmware/sim/parity.py > /tmp/py.json
          node firmware/sim/parity.mjs > /tmp/js.json
          node firmware/sim/parity.mjs --compare /tmp/py.json /tmp/js.json
      - name: Python / JS fox.json validator parity (same corpus, same effective config, same banner status)
        run: |
          python3 firmware/sim/schema_parity.py > /tmp/spy.json
          node firmware/sim/schema_parity.mjs > /tmp/sjs.json
          node firmware/sim/schema_parity.mjs --compare /tmp/spy.json /tmp/sjs.json

  foxlib-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Host build of the portable core + parity against foxlib (Morse, songs, schedules, cfg, synth)
        run: make -C firmware/foxlib-c/tests check
      # Pinned toolchain: the same compiler every time, by hash, so the UF2 on the site is reproducible from the
      # commit (two builds of one commit are bit-identical). Bumping it is a deliberate commit here, not an image drift.
      - name: Arm toolchain (xPack GCC 15.2.1-1.1, by sha256) + Pico SDK (2.1.1 by commit)
        env:
          TC_URL: https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v15.2.1-1.1/xpack-arm-none-eabi-gcc-15.2.1-1.1-linux-x64.tar.gz
          TC_SHA256: da6a49ad4003944b823c6c93702a8787c922ab34bd7e918ec0eaf6933a9b1ff6
          SDK_COMMIT: bddd20f928ce76142793bef434d4f75f4af6e433
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build
          curl -sSL -o /tmp/tc.tar.gz "$TC_URL"
          echo "$TC_SHA256  /tmp/tc.tar.gz" | sha256sum -c -
          mkdir -p /tmp/tc && tar -xzf /tmp/tc.tar.gz -C /tmp/tc --strip-components=1
          echo "/tmp/tc/bin" >> "$GITHUB_PATH"
          git init -q /tmp/pico-sdk && git -C /tmp/pico-sdk fetch -q --depth 1 https://github.com/raspberrypi/pico-sdk.git "$SDK_COMMIT" && git -C /tmp/pico-sdk checkout -q FETCH_HEAD
          git -C /tmp/pico-sdk submodule update -q --init --depth 1 lib/tinyusb
      - name: Build the PicoFox UF2
        env: { PICO_SDK_PATH: /tmp/pico-sdk }
        run: |
          arm-none-eabi-gcc --version | head -1
          cmake -S firmware/foxlib-c/picofox -B /tmp/fxbuild -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/fxbuild
      - name: Fingerprint (foxbench-picofox.json beside the UF2) and RAM budget
        env: { PICO_SDK_PATH: /tmp/pico-sdk }
        run: python3 tools/build_info.py /tmp/fxbuild --bss-budget 220000
      - uses: actions/upload-artifact@v4
        with:
          name: foxbench-picofox-uf2
          path: |
            /tmp/fxbuild/foxbench-picofox.uf2
            /tmp/fxbuild/foxbench-picofox.json

  kitsune:
    # fox-bench's build of kitsune (https://github.com/rfhs/kitsune) at a pinned commit, for the compiled family's
    # firmware card: merged images per board × challenge × tier plus a manifest with sha256s. kitsune belongs to its
    # authors; this job runs only when the repository variable KITSUNE_BUILD is "true", which is set once the project
    # has agreed to it (docs/kitsune-integration-plan.md §7). KITSUNE_COMMIT pins the commit. Until then the step is
    # skipped and the site hosts no kitsune images; the firmware card says so and takes a locally built image.
    if: vars.KITSUNE_BUILD == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: kitsune at the pinned commit
        env: { KITSUNE_COMMIT: '${{ vars.KITSUNE_COMMIT }}' }
        run: |
          test -n "$KITSUNE_COMMIT" || { echo "set the repository variable KITSUNE_COMMIT to the kitsune commit to build"; exit 1; }
          git init -q /tmp/kitsune && git -C /tmp/kitsune fetch -q --depth 1 https://github.com/rfhs/kitsune.git "$KITSUNE_COMMIT" && git -C /tmp/kitsune checkout -q FETCH_HEAD
      - name: Build the environments the catalog names and merge each into one image
        env: { KITSUNE_COMMIT: '${{ vars.KITSUNE_COMMIT }}' }
        run: |
          python3 -m pip install -q -U platformio esptool
          python3 tools/build_kitsune.py /tmp/kitsune /tmp/kitsune-out --commit "$KITSUNE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-images
          path: /tmp/kitsune-out

  deploy:
    # Only after every test job passed, only for pushes to main. A failed job upstream skips this one,
    # so a red suite leaves the live site as it was. The kitsune job is optional: skipped (not failed) when it is
    # not enabled, and its images are staged only when it ran.
    needs: [page, sim, foxlib-c, kitsune]
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.page.result == 'success' && needs.sim.result == 'success' && needs.foxlib-c.result == 'success' && (needs.kitsune.result == 'success' || needs.kitsune.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: The UF2 the foxlib-c job built and tested
        uses: actions/download-artifact@v4
        with:
          name: foxbench-picofox-uf2
          path: /tmp/uf2
      - name: kitsune images, when that job ran
        if: needs.kitsune.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: kitsune-images
          path: /tmp/kitsune-out
      - name: Stage site (page, descriptors, firmware the page deploys, docs)
        run: |
          mkdir -p _site
          cp -r index.html css js flasher hardware boards modules songs bands.json firmware docs DESIGN.md CONFIG.md PROTOCOL.md LICENSES.md LICENSE _site/
          rm -rf _site/firmware/sim _site/firmware/foxlib-c/tests/build
          cp /tmp/uf2/foxbench-picofox.uf2 /tmp/uf2/foxbench-picofox.json _site/firmware/foxlib-c/picofox/
          if [ -d /tmp/kitsune-out ]; then mkdir -p _site/firmware/kitsune && cp /tmp/kitsune-out/* _site/firmware/kitsune/; fi
          touch _site/.nojekyll   # Jekyll would drop foxlib/__init__.py (leading underscore)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    # A tag vX.Y.Z (the page version) makes a GitHub Release carrying the UF2 the tests ran against, its
    # fingerprint, and the staged site as a zip — "yesterday's page" and "yesterday's firmware" for anyone who
    # hits a regression on the live site. Nothing here publishes without the tag — or without the "release"
    # box ticked on a manual run from main, which creates that tag itself (at the js/main.js VERSION).
    needs: [page, sim, foxlib-c]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foxbench-picofox-uf2
          path: /tmp/uf2
      - name: The tag must name the page version (a manual run takes the version as its tag)
        run: |
          page=$(grep -o "const VERSION = '[^']*'" js/main.js | cut -d"'" -f2)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TAG="v$page"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              test "$(git ls-remote origin "refs/tags/$TAG" | cut -f1)" = "$GITHUB_SHA" \
                || { echo "$TAG already exists and points at another commit; bump VERSION in js/main.js first"; exit 1; }
            fi
          else
            TAG="$GITHUB_REF_NAME"
            test "${TAG#v}" = "$page" || { echo "tag $TAG but js/main.js VERSION is $page"; exit 1; }
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Stage the site as released and name the files
        run: |
          mkdir -p _site out
          cp -r index.html css js flasher hardware boards modules songs bands.json firmware docs DESIGN.md CONFIG.md PROTOCOL.md LICENSES.md LICENSE CHANGELOG.md _site/
          rm -rf _site/firmware/sim _site/firmware/foxlib-c/tests/build
          cp /tmp/uf2/foxbench-picofox.uf2 /tmp/uf2/foxbench-picofox.json _site/firmware/foxlib-c/picofox/
          touch _site/.nojekyll
          fw=$(cat firmware/foxlib-c/VERSION)
          cp /tmp/uf2/foxbench-picofox.uf2 "out/foxbench-picofox-$fw.uf2"
          cp /tmp/uf2/foxbench-picofox.json "out/foxbench-picofox-$fw.json"
          (cd _site && zip -qr "../out/fox-bench-site-$TAG.zip" .)
          (cd out && sha256sum * > SHA256SUMS)
          echo "fw=$fw" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md (this version's section, else Unreleased)
        run: python3 tools/release_notes.py "$TAG" > notes.md && cat notes.md
      - name: Create the release, or fill one that already exists for this tag
        # A release made from GitHub's "Draft a new release" page creates the tag too, and that tag push lands
        # here: then the release exists already, so attach the files to it instead of failing.
        # On a manual run the tag usually doesn't exist yet: `gh release create --target` makes it at this
        # commit. A tag created with the workflow token doesn't start another run, so nothing publishes twice.
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "fox-bench $TAG" --notes-file notes.md
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh release create "$TAG" out/* --title "fox-bench $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" out/* --title "fox-bench $TAG" --notes-file notes.md --verify-tag
          fi