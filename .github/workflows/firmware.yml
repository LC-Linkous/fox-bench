name: firmware
on: [push, pull_request]
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Syntax check (CircuitPython-compatible subset is not enforced here; the sim is)
        run: python3 -m py_compile firmware/foxlib/*.py firmware/templates/*/code.py
      - name: Deploy set matches manifests and index
        run: |
          python3 - <<'PY'
          import json, os, sys
          idx = json.load(open('firmware/index.json'))
          have = sorted(f for f in os.listdir('firmware/foxlib') if not f.startswith('__pycache__'))
          assert sorted(idx['foxlib']) == have, (idx['foxlib'], have)
          for t in idx['templates']:
              m = json.load(open(f'firmware/templates/{t}/template.json'))
              code = open(f'firmware/templates/{t}/code.py').read()
              assert f'version="{m["version"]}"' in code, f'{t}: code.py version != manifest {m["version"]}'
              for b in m['boards_tested'] or ['seeed_xiao_esp32c3']:
                  assert os.path.exists(f'firmware/templates/{t}/defaults/{b}.json'), f'{t}: no defaults for {b}'
          print('manifests ok')
          PY
      - name: Simulator — every template, every scenario
        run: python3 firmware/sim/run.py
      - name: Python / JS encoder parity
        run: |
          python3 firmware/sim/parity.py > /tmp/py.json
          node firmware/sim/parity.mjs > /tmp/js.json
          node firmware/sim/parity.mjs --compare /tmp/py.json /tmp/js.json
