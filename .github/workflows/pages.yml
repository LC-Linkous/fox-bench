name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (page, descriptors, firmware the page deploys, docs)
        run: |
          mkdir -p _site
          cp -r index.html css js boards modules songs bands.json firmware DESIGN.md CONFIG.md PROTOCOL.md _site/
          rm -rf _site/firmware/sim
          touch _site/.nojekyll   # Jekyll would drop foxlib/__init__.py (leading underscore)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
