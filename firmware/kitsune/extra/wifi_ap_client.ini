; fox-bench's additional PlatformIO environments for kitsune's wifi/wifi_ap_client project — boards kitsune does not
; list. Used as `pio run -c <this file> -d <kitsune>/wifi/wifi_ap_client` by tools/build_kitsune.py; kitsune's own
; platformio.ini is merged in unchanged (extra_configs), so its [env], [difficulty] and [mode] sections apply here and
; nothing in their tree is edited. Env names carry an fb- prefix so they can never be mistaken for kitsune's.
;
; LED: kitsune's include/rfhsledmacros.h picks DATA_PIN by ARDUINO_* board define and knows five boards; for any other
; board DATA_PIN is passed in here and the FastLED (digital LED) path is used — on a plain GPIO LED that means no colours.
; A proper entry belongs in kitsune ("PRs accepted to extend support to other platformio supported hardware").
[platformio]
extra_configs = platformio.ini

; Seeed XIAO ESP32C6 — ESP32-C6 needs the pioarduino platform fork, like kitsune's C5; yellow LED on GPIO15 (active low)
[seeed-xiao-esp32c6]
board = seeed_xiao_esp32c6
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DDATA_PIN=15

[env:fb-seeed-xiao-esp32c6-easy-ap]
extends = seeed-xiao-esp32c6
build_flags = ${difficulty.easy} ${mode.ap} ${seeed-xiao-esp32c6.board_flags}
[env:fb-seeed-xiao-esp32c6-easy-client]
extends = seeed-xiao-esp32c6
build_flags = ${difficulty.easy} ${mode.client} ${seeed-xiao-esp32c6.board_flags}
[env:fb-seeed-xiao-esp32c6-hard-ap]
extends = seeed-xiao-esp32c6
build_flags = ${difficulty.hard} ${mode.ap} ${seeed-xiao-esp32c6.board_flags}
[env:fb-seeed-xiao-esp32c6-hard-client]
extends = seeed-xiao-esp32c6
build_flags = ${difficulty.hard} ${mode.client} ${seeed-xiao-esp32c6.board_flags}
